<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>ui bench</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e12; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
      /* A still placeholder for the scene: a dusk snow slope under a low sun, bright enough that
         the interface has to hold on it. Gradients only (no files). */
      #bg { position: fixed; inset: 0; overflow: hidden; background:
        /* low sun haze over the ridge */
        radial-gradient(38% 26% at 70% 47%, rgba(255, 216, 170, .62), rgba(255, 200, 150, 0) 70%),
        /* wind streaks of lifted snow, on the slope only */
        repeating-linear-gradient(171deg, rgba(255, 255, 255, 0) 0 2.6%, rgba(255, 255, 255, .08) 2.9%, rgba(255, 255, 255, 0) 3.4%) 0 100% / 100% 44% no-repeat,
        /* long blue shadow running down the slope */
        linear-gradient(158deg, rgba(0, 0, 0, 0) 0 58%, rgba(96, 118, 152, .34) 66%, rgba(96, 118, 152, .12) 78%, rgba(0, 0, 0, 0) 88%),
        /* near slope: cream in the sun, blue-grey in the hollow */
        linear-gradient(170deg, rgba(0, 0, 0, 0) 0 52.5%, #c9d2de 52.7%, #ece7de 63%, #f2ede4 76%, #d9dde4 100%),
        /* dark tree line on the far ridge */
        linear-gradient(176.5deg, rgba(0, 0, 0, 0) 0 45.6%, #2a3138 45.8%, #3c4550 48.5%, rgba(0, 0, 0, 0) 48.7%),
        /* far ridge in shade */
        linear-gradient(177.5deg, rgba(0, 0, 0, 0) 0 41%, #7d8a9e 41.2%, #a3adbb 47%, #9aa6b6 100%),
        /* sky at dusk */
        linear-gradient(#26324a 0%, #46546e 18%, #8a8fa0 31%, #d2b29a 40%, #e9c9a8 44%);
      }
      #bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(130% 90% at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(5, 8, 14, .32)); }
      #bg.storm { background:
        repeating-linear-gradient(160deg, rgba(255, 255, 255, 0) 0 1.4%, rgba(255, 255, 255, .22) 1.7%, rgba(255, 255, 255, 0) 2.2%),
        repeating-linear-gradient(166deg, rgba(255, 255, 255, 0) 0 3.1%, rgba(255, 255, 255, .16) 3.5%, rgba(255, 255, 255, 0) 4%),
        linear-gradient(171deg, rgba(0, 0, 0, 0) 0 54%, rgba(214, 220, 228, .9) 56%, #eef0f2 70%, #e6e9ed 100%),
        linear-gradient(#aeb7c2 0%, #cfd5dc 30%, #e2e6ea 52%, #e9ecef 100%);
      }
      #bg.night { background:
        radial-gradient(30% 22% at 30% 70%, rgba(255, 150, 70, .22), rgba(255, 140, 60, 0) 70%),
        linear-gradient(170deg, rgba(0, 0, 0, 0) 0 52.5%, #2b3646 52.7%, #3a4658 70%, #2c3644 100%),
        linear-gradient(177.5deg, rgba(0, 0, 0, 0) 0 41%, #1a222d 41.2%, #222c38 100%),
        linear-gradient(#05080e 0%, #0b1220 30%, #1b2638 44%);
      }
      #ui { position: fixed; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="bg"></div>
    <div id="ui"></div>
    <script type="module" src="./ui.ts"></script>
  </body>
</html>
